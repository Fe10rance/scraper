name: pickin-update

on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 4 */5 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'deals | prices | all'
        required: true
        default: 'all'

# جلوگیری از اجرای هم‌زمان چند تا اجرای این ورک‌فلو با هم (چه cron چه دستی)
# تا هیچ‌وقت دو تا Job همزمان نخوان به یه برنچ push کنن.
concurrency:
  group: pickin-update-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-deals:
    name: update-deals
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        run: python scraper_headless.py --mode deals
        env:
          PICKIN_API: ${{ secrets.PICKIN_API }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/deals_latest.json
          if git diff --staged --quiet; then
            echo "تغییری برای commit نبود."
            exit 0
          fi
          git commit -m "deals update $(date '+%Y-%m-%d_%H-%M')"

          max_attempts=5
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "تلاش $attempt برای push..."
            git fetch origin main
            if git rebase origin/main; then
              if git push origin main; then
                echo "✅ push موفق بود."
                exit 0
              fi
            else
              git rebase --abort || true
              git reset --soft origin/main
              git add data/deals_latest.json
              git commit -m "deals update $(date '+%Y-%m-%d_%H-%M') (retry $attempt)"
            fi
            attempt=$((attempt + 1))
            sleep $((RANDOM % 10 + 5))
          done
          echo "❌ بعد از $max_attempts تلاش، push موفق نشد."
          exit 1

  update-technooff:
    name: update-technooff
    runs-on: ubuntu-latest
    needs: update-deals
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install playwright beautifulsoup4 requests

      - name: Install browser
        run: playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper_headless.py --mode technooff

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/technooff_latest.json
          if git diff --staged --quiet; then
            echo "تغییری برای commit نبود."
            exit 0
          fi
          git commit -m "technooff update $(date '+%Y-%m-%d_%H-%M')"

          max_attempts=5
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "تلاش $attempt برای push..."
            git fetch origin main
            if git rebase origin/main; then
              if git push origin main; then
                echo "✅ push موفق بود."
                exit 0
              fi
            else
              git rebase --abort || true
              git reset --soft origin/main
              git add data/technooff_latest.json
              git commit -m "technooff update $(date '+%Y-%m-%d_%H-%M') (retry $attempt)"
            fi
            attempt=$((attempt + 1))
            sleep $((RANDOM % 10 + 5))
          done
          echo "❌ بعد از $max_attempts تلاش، push موفق نشد."
          exit 1

  update-prices:
    name: update-prices
    runs-on: ubuntu-latest
    needs: update-technooff
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 4 */5 * *'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        run: python scraper_headless.py --mode prices
        env:
          PICKIN_API: ${{ secrets.PICKIN_API }}
          PICKIN_SECRET: ${{ secrets.PICKIN_SECRET }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/prices_latest.json
          if git diff --staged --quiet; then
            echo "تغییری برای commit نبود."
            exit 0
          fi
          git commit -m "prices update $(date '+%Y-%m-%d_%H-%M')"

          max_attempts=5
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "تلاش $attempt برای push..."
            git fetch origin main
            if git rebase origin/main; then
              if git push origin main; then
                echo "✅ push موفق بود."
                exit 0
              fi
            else
              git rebase --abort || true
              git reset --soft origin/main
              git add data/prices_latest.json
              git commit -m "prices update $(date '+%Y-%m-%d_%H-%M') (retry $attempt)"
            fi
            attempt=$((attempt + 1))
            sleep $((RANDOM % 10 + 5))
          done
          echo "❌ بعد از $max_attempts تلاش، push موفق نشد."
          exit 1
